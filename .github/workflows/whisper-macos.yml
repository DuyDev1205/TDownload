# whisper.cpp không phát hành bản chạy sẵn cho macOS. Workflow này build whisper-cli (universal: Intel + Apple Silicon,
# tăng tốc Metal) cho tính năng "Tạo phụ đề" và đăng lên Release "whisper-<phiên bản>". Release được đánh dấu
# pre-release để không trở thành bản "latest", vì bộ tự cập nhật của app đọc latest.json từ bản latest.
# Chạy: đẩy tag whisper-b5454 (khớp WHISPER_REF và link trong src-tauri/src/subtitle.rs), hoặc Actions → Run workflow.
name: Build whisper-cli (macOS)

on:
  workflow_dispatch:
  push:
    tags: ["whisper-*"]

env:
  WHISPER_REF: b5454

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: ${{ env.WHISPER_REF }}
          path: whisper.cpp

      - name: Build
        working-directory: whisper.cpp
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DGGML_NATIVE=OFF \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF
          cmake --build build --config Release -j 4 --target whisper-cli
          lipo -info build/bin/whisper-cli
          otool -L build/bin/whisper-cli
          codesign --force -s - build/bin/whisper-cli
          ./build/bin/whisper-cli --help > /dev/null 2>&1 || true
          (cd build/bin && zip -9 "$GITHUB_WORKSPACE/whisper-cli-macos.zip" whisper-cli)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="whisper-${WHISPER_REF}"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "whisper-cli ${WHISPER_REF} (macOS)" \
              --notes "Bản whisper-cli cho macOS (universal, Metal), app VidSaver tự tải khi dùng tính năng Tạo phụ đề lần đầu."
          gh release upload "$TAG" whisper-cli-macos.zip -R "$GITHUB_REPOSITORY" --clobber
